name: Cross-platform C++17
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_EXTENSIONS=OFF -DRFMODEL_BUILD_C_API=ON -DRFMODEL_BUILD_REFERENCE_TESTS=OFF
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel 2
      - name: Test core and CLI
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
      - name: Install package
        run: cmake --install build --config ${{ matrix.configuration }} --prefix "$PWD/install"
      - name: Configure independent consumer
        run: cmake -S tests/consumer -B consumer-build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_PREFIX_PATH="$PWD/install"
      - name: Build independent consumer
        run: cmake --build consumer-build --config ${{ matrix.configuration }} --parallel 2
      - name: Test installed package
        run: ctest --test-dir consumer-build -C ${{ matrix.configuration }} --output-on-failure
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build/Testing/Temporary/LastTest.log
            consumer-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
  cpp-sdk:
    name: C++ SDK / ${{ matrix.os }} / ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure native C++ tests without Python or C ABI
        run: >-
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_CXX_EXTENSIONS=OFF -DBUILD_TESTING=ON
          -DRFMODEL_BUILD_C_API=OFF -DRFMODEL_BUILD_CLI=OFF
          -DRFMODEL_BUILD_EXAMPLES=ON
      - name: Build and test native C++ API
        run: |
          cmake --build build-native --config ${{ matrix.configuration }} --parallel 2
          ctest --test-dir build-native -C ${{ matrix.configuration }} --output-on-failure
          ctest --test-dir build-native -C ${{ matrix.configuration }} --show-only=json-v1 > native-tests.json
      - name: Configure and install header-only SDK
        run: |
          cmake -S . -B build-sdk -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DBUILD_TESTING=OFF -DRFMODEL_BUILD_C_API=OFF -DRFMODEL_BUILD_CLI=OFF -DRFMODEL_BUILD_EXAMPLES=OFF
          cmake --build build-sdk --config ${{ matrix.configuration }}
          cmake --install build-sdk --config ${{ matrix.configuration }} --prefix "$PWD/install-cpp"
          mv install-cpp relocated-cpp
      - name: Consume relocated SDK from independent multi-translation-unit project
        run: |
          cmake -S tests/consumer -B consumer-cpp -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_PREFIX_PATH="$PWD/relocated-cpp"
          cmake --build consumer-cpp --config ${{ matrix.configuration }} --parallel 2
          ctest --test-dir consumer-cpp -C ${{ matrix.configuration }} --output-on-failure
      - name: Preserve native SDK verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-sdk-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            native-tests.json
            build-native/Testing/Temporary/LastTest.log
            consumer-cpp/Testing/Temporary/LastTest.log
  native-reference:
    name: Native archived replay / ${{ matrix.os }} / ${{ matrix.configuration }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test reference inventory tools
        run: python scripts/reference/test_extract_rf_models.py
      - name: Test reference parameter metadata
        run: python scripts/reference/test_extract_rf_parameters.py
      - name: Test reference result validation
        run: python scripts/reference/test_compare_attenuator.py
      - name: Test background reference runner
        run: python scripts/reference/test_run_systemvue_reference.py
      - name: Test antenna reference validation
        run: python scripts/reference/test_compare_antenna.py
      - name: Test antenna power sweep validation
        run: python scripts/reference/test_summarize_antenna_power.py
      - name: Test antenna nonlinear parameter audit
        run: python scripts/reference/test_audit_antenna_nonlinearity.py
      - name: Test compression diagnostic
        run: python scripts/reference/test_diagnose_antenna_compression.py
      - name: Test saturation warning diagnostic
        run: python scripts/reference/test_diagnose_single_saturation.py
      - name: Test Python retirement and independent capture imports
        run: python -I -S scripts/reference/test_python_retirement.py
      - name: Configure explicit developer replay without the C ABI
        run: >-
          cmake -S . -B build-reference -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_CXX_EXTENSIONS=OFF -DRFMODEL_BUILD_C_API=OFF
          -DRFMODEL_BUILD_CLI=OFF -DRFMODEL_BUILD_EXAMPLES=OFF
          -DRFMODEL_BUILD_REFERENCE_TESTS=ON
          -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build probes
        run: cmake --build build-reference --config ${{ matrix.configuration }} --target rfmodel_reference_highorder_probe rfmodel_reference_highorder_oracle --parallel 2
      - name: Replay frozen evidence, protocol faults and installed SDK
        run: ctest --test-dir build-reference -C ${{ matrix.configuration }} -R '^native_' --output-on-failure
      - name: Record replay identity and evidence
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          probe="build-reference/rfmodel_reference_highorder_probe$suffix"
          configured="build-reference/${{ matrix.configuration }}/rfmodel_reference_highorder_probe$suffix"
          if [ -f "$configured" ]; then probe="$configured"; fi
          python -I -S scripts/reference/native_replay.py --probe "$probe" --report build-reference/native-replay.json
          # A01 has a known native mismatch. Exit 1 with a saved report is expected;
          # test suites check all counts, tolerance and failure semantics.
          python -I -S scripts/reference/diagnose-am-pm-reference.py \
            validation/am-pm-existing-reference-evidence-20261012.json \
            build-reference/am-pm-native-replay.json --native-probe "$probe" || test "$?" -eq 1
          test -f build-reference/am-pm-native-replay.json
          python -I -S scripts/reference/diagnose-systemvue-am-pm-adapter.py \
            validation/am-pm-parameter-study-observations-20261013.json \
            validation/am-pm-adapter-observations-20261013.json \
            build-reference/am-pm-adapter-replay.json --native-probe "$probe"
          # Descriptive scoring retains all failed hypotheses. Success here
          # verifies acquisition-chain integrity and baseline reproduction.
          python -I -S scripts/reference/diagnose-am-pm-datapoints-zero-study.py \
            validation/am-pm-datapoints-zero-plan-20261013.json \
            validation/am-pm-datapoints-zero-observations-20261013.json \
            build-reference/am-pm-datapoints-zero-replay.json \
            --capture-manifest validation/am-pm-datapoints-zero-captures-20261013.json
          python -I -S scripts/reference/report-am-pm-datapoints-raw-axis-study.py \
            validation/am-pm-datapoints-raw-axis-plan-20261013.json \
            validation/am-pm-datapoints-raw-axis-observations-20261013.json \
            build-reference/am-pm-datapoints-raw-axis-replay.json \
            --capture-manifest validation/am-pm-datapoints-raw-axis-captures-20261013.json
          python -I -S scripts/reference/report-am-pm-datapoints-order-study.py \
            validation/am-pm-datapoints-order-plan-20261014.json \
            validation/am-pm-datapoints-order-observations-20261014.json \
            build-reference/am-pm-datapoints-order-replay.json \
            --capture-manifest validation/am-pm-datapoints-order-captures-20261014.json
          python -I -S scripts/reference/report-am-pm-datapoints-allocation-study.py \
            validation/am-pm-datapoints-allocation-plan-20261014.json \
            validation/am-pm-datapoints-allocation-observations-20261014.json \
            build-reference/am-pm-datapoints-allocation-replay.json \
            --capture-manifest validation/am-pm-datapoints-allocation-captures-20261014.json
      - name: Preserve replay verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-reference-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build-reference/Testing/Temporary/LastTest.log
            build-reference/native-replay.json
            build-reference/am-pm-native-replay.json
            build-reference/am-pm-adapter-replay.json
            build-reference/am-pm-datapoints-zero-replay.json
            build-reference/am-pm-datapoints-raw-axis-replay.json
            build-reference/am-pm-datapoints-order-replay.json
            build-reference/am-pm-datapoints-allocation-replay.json
            build-reference/**/*.manifest.json
            build-reference/reference-installed-sdk/consumer-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
